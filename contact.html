<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - QR Attendance</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     
    <!-- NAVIGATION BAR -->
     
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-qr-code"></i> QR Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <!-- CONTACT FORM  -->
    
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    
                    <!-- Card Container -->
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-5">
                            
                            <!-- Heading -->
                            <h2 class="text-center mb-2">
                                <i class="bi bi-envelope text-primary"></i> Contact Us
                            </h2>
                            <p class="text-center text-muted mb-4">We'd love to hear from you</p>

                            <!-- Alert (hidden by default - shows on success) -->
                            <div id="contactAlert" class="alert alert-success d-none"></div>

                            <!-- Contact Form -->
                            <form id="contactForm">
                                
                                <!-- Name Field -->
                                <div class="mb-3">
                                    <label for="contactName" class="form-label">Your Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-person"></i>
                                        </span>
                                        <input type="text" class="form-control" 
                                               id="contactName" 
                                               placeholder="Enter your name" required>
                                    </div>
                                </div>
                                
                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="contactEmail" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control" 
                                               id="contactEmail" 
                                               placeholder="Enter your email" required>
                                    </div>
                                </div>
                                
                                <!-- Subject Field -->
                                <div class="mb-3">
                                    <label for="contactSubject" class="form-label">Subject</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-tag"></i>
                                        </span>
                                        <input type="text" class="form-control" 
                                               id="contactSubject" 
                                               placeholder="Enter subject" required>
                                    </div>
                                </div>
                                
                                <!-- Message Field -->
                                <div class="mb-3">
                                    <label for="contactMessage" class="form-label">Message</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-chat"></i>
                                        </span>
                                        <textarea class="form-control" 
                                                  id="contactMessage" 
                                                  rows="4" 
                                                  placeholder="Enter your message" required></textarea>
                                    </div>
                                </div>
                                
                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="bi bi-send"></i> Send Message
                                </button>
                                
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

     
    <!-- FOOTER -->
     
    
    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 QR Attendance System. All rights reserved.</p>
            <p class="text-muted small">ICT1209 Mini Project</p>
        </div>
    </footer>

    
    <!-- SCRIPTS   -->
     
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
