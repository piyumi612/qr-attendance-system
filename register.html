<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QR Attendance</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
    <!-- NAVIGATION BAR -->
     
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-qr-code"></i> QR Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    
                    <!-- Card Container -->
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-5">
                            
                            <!-- Heading -->
                            <h2 class="text-center mb-2">
                                <i class="bi bi-person-plus text-primary"></i> Register
                            </h2>
                            <p class="text-center text-muted mb-4">Create your account</p>

                            <!-- Alert (hidden by default - shows on error) -->
                            <div id="registerAlert" class="alert alert-danger d-none"></div>

                            <!-- Register Form -->
                            <form id="registerForm">
                                
                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label for="registerName" class="form-label">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-person"></i>
                                        </span>
                                        <input type="text" class="form-control" 
                                               id="registerName" 
                                               placeholder="Enter your full name" required>
                                    </div>
                                </div>
                                
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control" 
                                               id="registerEmail" 
                                               placeholder="Enter your email" required>
                                    </div>
                                </div>
                                
                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" 
                                               id="registerPassword" 
                                               placeholder="Create password (min 6 chars)" required>
                                    </div>
                                    <small class="text-muted">Password must be at least 6 characters</small>
                                </div>
                                
                                <!-- Confirm Password -->
                                <div class="mb-3">
                                    <label for="registerConfirm" class="form-label">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-shield-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" 
                                               id="registerConfirm" 
                                               placeholder="Confirm your password" required>
                                    </div>
                                </div>
                                
                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="bi bi-person-plus"></i> Register
                                </button>
                                
                            </form>

                            <!-- Login Link -->
                            <p class="text-center mt-3">
                                Already have an account? 
                                <a href="login.html">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    
    <!-- FOOTER  -->
    
    
    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 QR Attendance System. All rights reserved.</p>

        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
